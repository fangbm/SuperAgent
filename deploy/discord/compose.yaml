services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/discord/Dockerfile
    image: superagent-discord-bot:local
    init: true
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DISCORD_BOT_TOKEN_FILE: /run/secrets/discord_token
    secrets:
      - discord_token
    volumes:
      - type: bind
        source: ../../.artifacts/discord-bot/data
        target: /data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "scripts/discord-bot.mjs", "--config", "community/idle-abyss-princesses/bot-config.json", "--database", "/data/archive.sqlite", "--status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

secrets:
  discord_token:
    file: ../../.artifacts/discord-bot/secrets/discord_token.txt
